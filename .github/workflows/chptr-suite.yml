name: chptr-suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/chptr_quality.py
      - run: python3 -m unittest discover -s tests -v
